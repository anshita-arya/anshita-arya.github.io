<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Anshita Arya · Product Manager</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="portfolio.css" />
</head>
<body>

<!-- NAV -->
<nav>
  <div class="nav-inner">
    <a href="#about" class="nav-logo">Anshita Arya</a>
    <ul class="nav-links">
      <li><a href="#about">About</a></li>
      <li><a href="#experience">Experience</a></li>
      <li><a href="#education">Education</a></li>
      <li><a href="#talks">Talks</a></li>
      <li><a href="#projects">Projects</a></li>
      <li><a href="#blogs">Blogs</a></li>
      <li><a href="#awards">Awards</a></li>
      <li><a href="#volunteering-community">Volunteering &amp; Community</a></li>
      <li><a href="#contact">Contact</a></li>
    </ul>
  </div>
</nav>

<main id="main-content">
  <!-- Sections loaded from sections/ directory -->
</main>

<footer>
  <p>Designed &amp; built by Anshita Arya · 2026</p>
</footer>

<script>
  const sectionOrder = ['hero', 'about', 'experience', 'education', 'projects', 'talks', 'blogs', 'awards', 'volunteering-community', 'contact'];
  const tabNames = ['about', 'experience', 'education', 'projects', 'talks', 'blogs', 'awards', 'volunteering-community', 'contact'];
  const main = document.getElementById('main-content');

  const activateTab = (id) => {
    const panels = document.querySelectorAll('.tab-panel');
    panels.forEach(panel => {
      panel.classList.toggle('active', panel.dataset.section === id);
    });

    document.querySelectorAll('.nav-links a').forEach(link => {
      const target = link.getAttribute('href')?.replace('#', '');
      const isActive = target === id;
      link.classList.toggle('active', isActive);
    });

    const heroSection = document.querySelector('section#hero');
    if (heroSection) {
      heroSection.style.display = id === 'about' ? '' : 'none';
    }

    history.replaceState(null, '', `#${id}`);
  };

  const bindNav = () => {
    document.querySelectorAll('a[href^="#"]').forEach(link => {
      const target = link.getAttribute('href')?.replace('#', '');
      if (!target || !tabNames.includes(target)) return;

      link.addEventListener('click', (event) => {
        event.preventDefault();
        activateTab(target);
      });
    });
  };

  (async () => {
    for (const name of sectionOrder) {
      const res = await fetch(`sections/${name}.html`);
      const html = await res.text();
      const fragment = document.createElement('div');
      fragment.innerHTML = html;
      const section = fragment.firstElementChild;
      if (!section) continue;

      section.dataset.section = name;
      if (name !== 'hero') {
        section.classList.add('tab-panel');
      }

      main.appendChild(section);
    }

    const initialTab = tabNames.includes(window.location.hash.replace('#', ''))
      ? window.location.hash.replace('#', '')
      : 'about';

    activateTab(initialTab);
    bindNav();
  })();
</script>

</body>
</html>
